name: balance
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: The balance check fails loudly on a bad price
        run: python3 tools/balance.py --selftest
      - name: Balance tables for all ten floors (fails on any bad number)
        run: python3 tools/balance.py --check
      - name: Floor 1 economy (fails if a vocation loses money)
        run: python3 tools/gen_economy.py
      - name: Fail if committed tables are stale
        run: git diff --exit-code -- data/ BALANCE.md ECONOMY.md server/data-spirebound/lib/spirebound/tasks_floors.lua
