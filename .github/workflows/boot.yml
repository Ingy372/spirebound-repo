name: boot test
# Roadmap R18: the same boot test as on Jay's PC (tools/test_boot.sh): builds the pinned Canary server with our
# datapack, starts it with a fresh database, runs every in-game test and fails on any error or failed test.
on: [push, pull_request]
jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install MariaDB and the server's libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mariadb-server mariadb-client rsync
          sudo service mariadb start
      - name: Boot test (in-game tests included)
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" SPIRE_SETUP_DB=1 bash tools/test_boot.sh 180 2>&1 | tee boot-output.txt
      # R18: a test through the real network path: a character per class logs in with the real game handshake, talks
      # to the real NPCs, takes and finishes both outfit-addon quests (tools/loadtest.py addon, 6.5c)
      - name: End-to-end test over the network (outfit addon quests)
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" python3 tools/loadtest.py addon 2>&1 | tee -a boot-output.txt
      # The run's logs need a GitHub sign-in to read, but annotations show on the run page for anyone (and for
      # Claude's browser): put the reason for a failure there.
      - name: Show why it failed
        if: failure()
        run: |
          grep -E "FAIL|Error|error|Segmentation|Aborted|core dumped" boot-output.txt | tail -6 | while IFS= read -r l; do echo "::error title=boot test::${l:0:900}"; done
          [ -f .build/boot.log ] && tail -4 .build/boot.log | while IFS= read -r l; do echo "::error title=last server log line::${l:0:900}"; done || true
      - name: Keep the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log
          path: .build/boot.log
          if-no-files-found: ignore
